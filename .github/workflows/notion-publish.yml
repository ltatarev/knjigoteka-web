name: Notion write-back

# Once a sync pull request is merged, tell Notion. Status becomes "Objavljeno"
# and the live URL lands in "Objavljeno na", which is the only signal a writer
# gets that their post actually made it.
#
# This is the only place in the project that writes to Notion, and it touches
# exactly two properties. The page body is never written back — the sync is
# one-way by design, and a round trip would let a conversion bug overwrite a
# writer's own words.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write

# Shared with the sync workflow so the two never talk to Notion at once: a sync
# querying "Za objavu" while a page is mid-flip would read a stale status.
concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  write-back:
    # Closed-without-merging must do nothing, and only the sync's own branch may
    # trigger a Notion write — otherwise any pull request in the repository
    # could reach the workspace.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'notion-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch that was merged into
        # Not the merge ref: what matters is the content that is now live on the
        # base branch, which is what the deploy will publish.
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # No npm ci, and so no npm cache either: the write-back path uses nothing
      # but Node builtins — no sharp, no MDX toolchain. Keeping the install out
      # means a post's "objavljeno" signal cannot be lost to a dependency
      # failing to resolve.

      - name: Collect the posts this merge published
        id: posts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$NUMBER" --json files --jq '.files[].path' \
            | grep -E '^content/posts/.*\.mdx$' > posts.txt || true
          echo "count=$(wc -l < posts.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat posts.txt

      - name: Mark them published in Notion
        id: publish
        if: steps.posts.outputs.count != '0'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # Only the default branch deploys, so only there is there a live URL
          # to wait for. Merging into a working branch still records the link —
          # it just cannot verify it yet.
          VERIFY: ${{ github.event.pull_request.base.ref == github.event.repository.default_branch && '--verify-live' || '' }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2046  # deliberate: one argument per file
          node notion-sync.mjs --publish $VERIFY --notify --report publish-report.json \
            $(cat posts.txt) 2>&1 | tee publish.log

      - name: Tell the maintainer
        # A write-back failure is worse than a sync failure: the post is already
        # live, so nothing retries it. Without this it fails completely silently.
        if: always() && steps.publish.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Issues can be turned off on a repository. Notification plumbing must
          # never be the thing that fails a sync, so probe first and downgrade
          # to a warning — a red run still emails the maintainer either way.
          if ! gh issue list --state open --limit 1 >/dev/null 2>&1; then
            echo "::warning::Issues su isključeni na repozitoriju, pa nema trajnog zapisa o kvaru. Uključi ih u Settings → General → Features."
            exit 0
          fi

          gh label create notion-sync --color B60205 \
            --description "Notion → MDX sinkronizacija" 2>/dev/null || true
          node .github/scripts/issue-body.mjs publish-report.json "$RUN_URL" > issue.md
          NUMBER="$(gh issue list --label notion-sync --state open --json number --jq '.[0].number // empty')"
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file issue.md
          else
            gh issue create --title "Objava nije upisana natrag u Notion" \
              --label notion-sync --body-file issue.md
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo '## Notion write-back'
            echo
            echo '```'
            cat publish.log 2>/dev/null || echo '(nothing published)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
