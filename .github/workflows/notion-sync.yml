name: Notion sync

# Convert every page marked "Za objavu", delete the post behind every page
# marked "Skriveno", commit the result to a branch, and open one pull request
# per run. Merging that PR is what publishes — the status flip and the live URL
# are then written back by notion-publish.yml.
#
# A run can do both at once, so the pull request is not always additive: read
# its body before merging, not just its title.

on:
  schedule:
    # Once a day, overnight. GitHub cron is always UTC, so this is 01:00 in
    # Croatia in winter and 02:00 in summer — close enough to midnight for a
    # blog, and nobody is waiting on it at that hour.
    #
    # Scheduled runs are queued on a best-effort basis and skew under load, so
    # the time is approximate. A writer who does not want to wait for it uses
    # workflow_dispatch below: Actions → Notion sync → Run workflow, which
    # publishes within a few minutes.
    #
    # NOTE: both triggers only work from the default branch — a schedule never
    # fires from a topic branch, and this file has to exist on the default
    # branch before it can be dispatched at all. Editing the workflow on a
    # branch changes nothing until that branch is merged.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

# Two writers flipping status at the same time must not produce two competing
# syncs racing to force-push the same branch. In-progress runs are never
# cancelled: a cancelled run can leave the branch half-written.
concurrency:
  group: notion-sync
  cancel-in-progress: false

env:
  # One long-lived branch, force-pushed each run and rebuilt from scratch from
  # whatever Notion currently says. A per-run branch would open a fresh pull
  # request every run for as long as the first one sat unmerged — a manual
  # dispatch while one is already open is exactly when that would happen.
  SYNC_BRANCH: notion-sync
  REPORT: sync-report.json
  BODY: pr-body.md
  TITLE_FILE: pr-title.txt

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # The sync reads content/posts to map notionId → existing slug, which is
        # what freezes a published post's URL across a retitle. Without the
        # checkout every post would look new.
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # sharp is a devDependency and the sync refuses to run without it, so a
      # plain `npm ci` is required — `--omit=dev` would fail the next step.
      - name: Install dependencies
        run: npm ci

      - name: Sync from Notion
        id: sync
        # A page can be rejected while others convert fine. Keep going so the
        # good ones still reach a pull request, then fail the job at the end.
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          set -o pipefail
          node notion-sync.mjs --report "$REPORT" --notify 2>&1 | tee sync.log

      - name: Check the sync produced a report
        # No report means the sync died before reaching the database — a bad
        # token, a network failure, a crash. Distinguishing that from "nothing
        # was ready to publish" is the whole point of writing the file.
        run: |
          if [ ! -f "$REPORT" ]; then
            echo "::error::Sinkronizacija nije završila — nema izvještaja. Provjeri log iznad."
            exit 1
          fi

      - name: Stage what changed
        id: changes
        run: |
          # Only these two paths are ever machine-written. Scoping the commit
          # keeps an unrelated stray file out of a post's pull request.
          #
          # -A rather than a bare add: a page moved to "Skriveno" is published
          # as a *deletion*, and without it the removal would never be staged.
          git add -A content/posts public/images/posts
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed — Notion matches the repository."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Build the pull request text
        if: steps.changes.outputs.changed == 'true'
        run: node .github/scripts/pr-body.mjs "$REPORT" "$BODY" "$TITLE_FILE"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "knjigoteka-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # -B keeps the staged changes and moves onto the sync branch, so the
          # commit sits on top of the branch this run was triggered from.
          git checkout -B "$SYNC_BRANCH"
          git commit -F "$TITLE_FILE"

          # The sync is deterministic: same Notion state, same base, same files.
          # Re-running against an unmerged pull request would otherwise
          # force-push an identical tree under a new commit hash and bury the
          # reviewer in "force-pushed" notifications.
          #
          # Fetched into an explicit remote-tracking ref rather than read back
          # out of FETCH_HEAD: the checkout above already wrote FETCH_HEAD, so
          # on the first ever run — when the branch does not exist yet and the
          # fetch fails — FETCH_HEAD would still resolve, to the wrong commit.
          if git fetch --depth=1 origin \
               "refs/heads/$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH" 2>/dev/null &&
             [ "$(git rev-parse HEAD^{tree})" = \
               "$(git rev-parse "origin/$SYNC_BRANCH^{tree}")" ]; then
            echo "Identical to the open pull request — not pushing."
          else
            git push --force origin "$SYNC_BRANCH"
          fi

      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        id: openpr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.ref_name }}
        run: |
          TITLE="$(cat "$TITLE_FILE")"
          NUMBER="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$NUMBER" ]; then
            # A run that gathers a second post has to restate the whole PR:
            # the body describes every post on the branch, not just the new one.
            gh pr edit "$NUMBER" --title "$TITLE" --body-file "$BODY"
          else
            gh pr create --base "$BASE" --head "$SYNC_BRANCH" --title "$TITLE" --body-file "$BODY"
            NUMBER="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=$(gh pr view "$NUMBER" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Summary
        # Runs even when the sync failed — a failed run is exactly when someone
        # needs to read what happened without digging through logs.
        if: always()
        run: |
          {
            echo '## Notion → MDX'
            echo
            if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
              echo "Pull request: ${{ steps.openpr.outputs.url }}"
            else
              echo 'Ništa novo — Notion i repozitorij su usklađeni.'
            fi
            echo
            echo '```'
            cat sync.log 2>/dev/null || echo '(no output — the sync did not start)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tell the maintainer
        # The writer hears about their own page in Notion. This is the other
        # half: the problems only the maintainer can fix, and the ones where
        # the sync never got far enough to comment on anything.
        #
        # One issue, edited in place and closed when the sync recovers — a new
        # issue per run would be filtered to a folder within a week.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.sync.outcome }}
        run: |
          # Issues can be turned off on a repository. Notification plumbing must
          # never be the thing that fails a sync, so probe first and downgrade
          # to a warning — a red run still emails the maintainer either way.
          if ! gh issue list --state open --limit 1 >/dev/null 2>&1; then
            echo "::warning::Issues su isključeni na repozitoriju, pa nema trajnog zapisa o kvaru. Uključi ih u Settings → General → Features."
            exit 0
          fi

          gh label create notion-sync --color B60205 \
            --description "Notion → MDX sinkronizacija" 2>/dev/null || true
          NUMBER="$(gh issue list --label notion-sync --state open --json number --jq '.[0].number // empty')"

          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$NUMBER" ]; then
              gh issue close "$NUMBER" --comment "Sinkronizacija ponovno prolazi."
            fi
            exit 0
          fi

          node .github/scripts/issue-body.mjs "$REPORT" "$RUN_URL" > issue.md
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file issue.md
          else
            gh issue create --title "Sinkronizacija iz Notiona ne prolazi" \
              --label notion-sync --body-file issue.md
          fi

      - name: Fail if any page was rejected
        # Last, so a rejected page turns the run red *after* the pages that did
        # convert have reached a pull request. Silence is the failure mode this
        # whole pipeline is built to avoid — --notify has already told the
        # writer on their own page by the time this runs.
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::Barem jedna stranica nije objavljena — pogledaj sažetak iznad."
          exit 1
