[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify's Next.js Runtime v5 is applied automatically for Next 13.5+ — the
# @netlify/plugin-nextjs package should NOT be added manually. The site runs in
# server mode (not output: "export"); pages are still prerendered at build time.
